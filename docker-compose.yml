services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalized-journaling-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # SQLite database stored on the mounted volume
      - DATABASE_URL=file:/data/prod.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - journaling_data:/data
    networks:
      - journaling-network

networks:
  journaling-network:
    driver: bridge

volumes:
  journaling_data:
